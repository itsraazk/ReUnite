<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ReUnite | Edit User</title><link rel="stylesheet" href="css/style.css?v=fix20261128"></head><body data-page="edit-user"><div class="app-shell"><header class="simple-header"><a href="account.html">←</a><h2>Edit User Details</h2><span></span></header><main class="content"><section class="form-card"><form action="/user/update" method="POST"><div class="form-grid two-col"><div class="form-group"><label>First Name</label><input name="first_name" required></div><div class="form-group"><label>Last Name</label><input name="last_name" required></div></div><div class="form-grid two-col"><div class="form-group"><label for="state-code">State / Union Territory</label><select id="state-code" name="state_code" required><option value="" disabled selected>Select your state or UT</option><optgroup label="States"><option value="AP">Andhra Pradesh</option><option value="AR">Arunachal Pradesh</option><option value="AS">Assam</option><option value="BR">Bihar</option><option value="CG">Chhattisgarh</option><option value="GA">Goa</option><option value="GJ">Gujarat</option><option value="HR">Haryana</option><option value="HP">Himachal Pradesh</option><option value="JH">Jharkhand</option><option value="KA">Karnataka</option><option value="KL">Kerala</option><option value="MP">Madhya Pradesh</option><option value="MH">Maharashtra</option><option value="MN">Manipur</option><option value="ML">Meghalaya</option><option value="MZ">Mizoram</option><option value="NL">Nagaland</option><option value="OD">Odisha</option><option value="PB">Punjab</option><option value="RJ">Rajasthan</option><option value="SK">Sikkim</option><option value="TN">Tamil Nadu</option><option value="TS">Telangana</option><option value="TR">Tripura</option><option value="UP">Uttar Pradesh</option><option value="UK">Uttarakhand</option><option value="WB">West Bengal</option></optgroup><optgroup label="Union Territories"><option value="AN">Andaman and Nicobar Islands</option><option value="CH">Chandigarh</option><option value="DH">Dadra and Nagar Haveli and Daman and Diu</option><option value="DL">Delhi</option><option value="JK">Jammu and Kashmir</option><option value="LA">Ladakh</option><option value="LD">Lakshadweep</option><option value="PY">Puducherry</option></optgroup></select></div><div class="form-group"><label for="city-select">City / District</label><select id="city-select" name="city" required disabled><option value="" disabled selected>Select state first</option></select></div></div><div class="form-group" data-city-other hidden><label for="city-other">Your city / district</label><input id="city-other" name="city_other" type="text" maxlength="100" placeholder="Type your city or district"></div><div class="form-group"><label>Email</label><input name="email" type="email" required></div><button class="btn btn-primary btn-wide" type="submit">Save Changes</button></form><p><a class="btn btn-secondary btn-wide" href="change-password.html">Change Password</a></p></section></main></div><script src="state-district.js?v=fix20261128"></script><script src="app.js?v=fix20261128"></script></body></html>

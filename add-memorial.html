<!-- ReUnite file guide: Form for preserving the memory and story of a beloved pet. Keep this page structure intact; shared styles live in css/style.css and page behavior lives in app.js. -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ReUnite | Forever in Our Hearts</title><link rel="stylesheet" href="css/style.css?v=warm20261017"></head><body><div class="app-shell"><header class="simple-header"><a href="pet.html">←</a><h2>Forever in Our Hearts</h2><span></span></header><main class="content memorial-page"><section class="memorial-intro"><div class="memorial-emblem">🕊️</div><span class="eyebrow">A PLACE FOR THEIR MEMORY</span><h1>The love stays with us.</h1><p class="muted">Celebrate a life that made yours brighter. This memorial is private to your ReUnite account and separate from active pet profiles.</p></section><section class="form-card"><form action="/memorials" method="POST" data-photo-form><label class="photo-upload"><input id="pet-photo-input" type="file" accept="image/jpeg,image/png,image/webp"><span class="photo-upload-preview" data-photo-preview>🌼</span><span>Add a favourite photo</span><small>Optional • JPG, PNG or WebP • max 2 MB</small></label><input type="hidden" name="photo_data" data-photo-data><div class="form-group"><label>Their name *</label><input name="name" maxlength="100" placeholder="The name you still say with love" required></div><div class="form-group"><label>Who were they?</label><select name="pet_type"><option>Dog</option><option>Cat</option><option>Bird</option><option>Rabbit</option><option>Horse</option><option>Other beloved pet</option></select></div><div class="form-grid two-col"><div class="form-group"><label>Birthday (optional)</label><input name="birth_date" type="date"></div><div class="form-group"><label>Date remembered (optional)</label><input name="remembrance_date" type="date"></div></div><div class="form-group"><label>Their story *</label><textarea name="story" maxlength="5000" rows="7" placeholder="Tell us about their personality, your favourite moments, and what made them unforgettable…" required></textarea><small class="muted">Up to 5,000 characters. Share only what feels right to you.</small></div><button class="btn btn-primary btn-wide" type="submit">Save Their Memory ♥</button><a class="btn btn-outline btn-wide" href="pet.html">Maybe later</a></form></section></main></div><script src="app.js?v=fix20261128"></script></body></html>

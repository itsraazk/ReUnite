<!-- ReUnite file guide: Form for marking a pet as lost and recording last-seen details. Keep this page structure intact; shared styles live in css/style.css and page behavior lives in app.js. -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ReUnite | I Lost My Dog</title><link rel="stylesheet" href="css/style.css?v=fix20261128"></head><body data-page="lost-pet"><div class="app-shell"><header class="simple-header"><a href="pet.html">←</a><h2>I Lost My Dog</h2><span></span></header><main class="content"><section class="warning-card"><div class="warning-icon">!</div><div><h2><span data-lost-pet-name>Your dog</span> is being marked as lost</h2><p>Adding accurate information can help a finder understand when and where your dog was last seen.</p></div></section><section class="form-card"><form method="POST"><div class="form-group"><label>Date Lost</label><input name="lost_date" type="date" required></div><div class="form-group"><label>Approximate Time</label><input name="lost_time" type="time"></div><div class="form-group"><label>Last Seen Location / Place</label><input name="last_seen_location" type="text" placeholder="e.g. Near City Park"></div><div class="form-group"><label>Additional Information</label><textarea name="lost_info" placeholder="Anything useful for someone who finds your dog..."></textarea></div><button class="btn btn-danger btn-wide" type="submit">Mark as Lost</button></form></section></main></div><script src="app.js?v=fix20261128"></script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReUnite | Adoption Requests</title><link rel="stylesheet" href="css/style.css?v=fix20261128"></head><body><div class="app-shell"><header class="simple-header"><a href="account.html">←</a><h2>Adoption Requests</h2><span></span></header><main class="content"><div id="requests"><p class="muted">Loading requests…</p></div></main></div><script>const e=document.querySelector('#requests');const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/adoption/requests').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{e.innerHTML=(d.requests||[]).map(a=>`<article class="card"><h3>${h(a.pet_name)}</h3><p><b>${h(a.applicant_name||'Member')}</b> · ${new Date(a.created_at).toLocaleString()}</p><p>${h(a.message)}</p><p>Contact: ${h(a.contact)}</p></article>`).join('')||'<p class="muted">No adoption requests yet.</p>'}).catch(()=>e.textContent='Please log in to view your adoption requests.');</script></body></html>

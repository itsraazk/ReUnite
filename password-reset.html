<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReUnite | Set New Password</title><link rel="stylesheet" href="css/style.css?v=fix20261128"></head><body class="auth-page"><main class="auth-card"><a class="back-link" href="login.html">← Login</a><div class="page-icon">🔑</div><h1>Set a new password</h1><form action="/reset-password" method="POST"><input type="hidden" name="token" id="token"><div class="form-group"><label>New password</label><input type="password" name="password" minlength="8" required autocomplete="new-password"></div><div class="form-group"><label>Confirm new password</label><input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></div><button class="btn btn-primary btn-wide">Update Password</button></form><script>document.querySelector('#token').value=new URLSearchParams(location.search).get('token')||'';</script></main></body></html>

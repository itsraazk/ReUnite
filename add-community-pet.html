<!-- ReUnite file guide: Form for recording a familiar community animal. Keep this page structure intact; shared styles live in css/style.css and page behavior lives in app.js. -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ReUnite | Add Community Pet</title><link rel="stylesheet" href="css/style.css?v=fix20261128"></head><body><div class="app-shell"><header class="simple-header"><a href="pet.html">←</a><h2>Add Community Pet</h2><span></span></header><main class="content"><section class="card"><span class="eyebrow">COMMUNITY CARE 🐾</span><h1>Register a neighbourhood animal</h1><p class="muted">For animals without a known owner. This profile only shares their local name and usual location. It has no Lost/Found status, owner contact or chat.</p></section><section class="form-card"><label class="photo-upload"><input id="pet-photo-input" type="file" accept="image/jpeg,image/png,image/webp"><span class="photo-upload-preview" data-photo-preview>📷</span><span>Optional pet photo</span><small>JPG, PNG or WebP • max 2 MB</small></label><form action="/community-pets" method="POST" data-photo-form><input type="hidden" name="photo_data" data-photo-data><div class="form-group"><label>Local name *</label><input name="name" maxlength="100" placeholder="e.g. Sheru" required></div><div class="form-group"><label>Pet Type *</label><select name="pet_type" id="pet-type" required><option value="Dog">🐕 Dog</option><option value="Cat">🐈 Cat</option><option value="Horse">🐎 Horse</option><option value="Goat">🐐 Goat</option><option value="Cow">🐄 Cow</option><option value="Other">🐾 Other</option></select></div><div class="form-group other-type-group" data-other-type hidden><label for="other-pet-type">Which animal is it? *</label><input name="other_pet_type" id="other-pet-type" type="text" maxlength="40" placeholder="Type the animal name, e.g. Rabbit"></div><div class="form-group"><label>Usual location *</label><input name="usual_location" maxlength="240" placeholder="e.g. near the main market / lane 3" required><small class="muted">Use a general public landmark; avoid private home addresses.</small></div><button class="btn btn-primary btn-wide" type="submit">Create Community QR</button></form></section></main></div><script src="app.js?v=fix20261128"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print ReUnite QR</title><link rel="stylesheet" href="css/style.css?v=fix20261128"><style>.print-tools{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:20px}.qr-paper{background:white;color:#111;margin:20px auto;padding:18px;text-align:center;max-width:95%;width:320px;border:1px solid #ddd}.qr-paper img{width:100%;height:auto}.qr-paper h2,.qr-paper p{color:#111}@media print{body{background:white!important}.no-print{display:none!important}.qr-paper{border:0;margin:0 auto;break-inside:avoid}}</style></head><body><main class="content"><div class="print-tools no-print"><label>QR size <select id="size"><option value="25">25 mm</option><option value="30" selected>30 mm</option><option value="40">40 mm</option><option value="50">50 mm</option><option value="60">60 mm</option><option value="75">75 mm</option><option value="100">100 mm</option></select></label><button class="btn btn-primary" onclick="window.print()">Print QR</button><a class="btn btn-secondary" id="download" download="reunite-qr.svg">Download QR</a></div><section class="qr-paper" id="paper"><h2>ReUnite 🐾</h2><img id="qr" alt="Pet QR code"><p>Scan to view pet details and contact the owner</p><strong id="petid"></strong></section></main><script>const q=new URLSearchParams(location.search),id=q.get('id');const img=document.querySelector('#qr'),url='/api/pets/'+encodeURIComponent(id)+'/qr';img.src=url;document.querySelector('#download').href=url;document.querySelector('#petid').textContent='Pet ID: '+id;document.querySelector('#size').addEventListener('change',e=>{document.querySelector('#paper').style.width=e.target.value+'mm'});document.querySelector('#paper').style.width='30mm';</script></body></html>

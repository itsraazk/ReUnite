<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReUnite | Forgot Password</title><link rel="stylesheet" href="css/style.css?v=fix20261128"></head><body class="auth-page"><main class="auth-card"><a class="back-link" href="login.html">← Back to login</a><div class="page-icon">🔐</div><h1>Forgot password?</h1><p class="muted">Enter your registered email. A secure, single-use reset link will be generated.</p><form action="/forgot-password" method="POST"><div class="form-group"><label>Email</label><input name="email" type="email" required></div><button class="btn btn-primary btn-wide">Send reset link</button></form><p class="small-note">For this local build, the reset URL appears in the server terminal. Connect an email provider before public deployment.</p><section id="reset" hidden><h2>Set a new password</h2><form action="/reset-password" method="POST"><input type="hidden" name="token" id="token"><div class="form-group"><label>New password</label><input name="password" type="password" minlength="8" required></div><div class="form-group"><label>Confirm password</label><input name="confirm_password" type="password" minlength="8" required></div><button class="btn btn-primary btn-wide">Reset password</button></form></section><script>const t=new URLSearchParams(location.search).get('token');if(t){document.querySelector('form[action="/forgot-password"]').hidden=true;document.querySelector('#reset').hidden=false;document.querySelector('#token').value=t;}</script></main><script src="password-toggle.js"></script></body></html>

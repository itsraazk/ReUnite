<!-- ReUnite file guide: Form for registering a personally owned pet. Keep this page structure intact; shared styles live in css/style.css and page behavior lives in app.js. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReUnite | Add Pet</title>
  <link rel="stylesheet" href="css/style.css?v=fix20261128">
</head>
<body>
<div class="app-shell">
  <header class="simple-header"><a href="pet.html">←</a><h2>Add Pet</h2><span></span></header>
  <main class="content">
    <section class="form-card">
      <form action="/pets" method="POST" data-photo-form><input type="hidden" name="photo_data" data-photo-data><input type="hidden" name="photo_data_list" id="photo-data-list">
        <div class="photo-section"><div class="photo-grid" data-photo-grid data-max="9" aria-label="Pet photos"></div><input id="pet-photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><p class="photo-hint" data-photo-hint>Add up to 9 photos • JPG, PNG or WebP • max 5 MB each</p></div>
        <div class="form-group"><label>Pet Name</label><input name="name" type="text" placeholder="e.g. Max" required></div>
        <div class="form-group"><label>Pet Type *</label><select name="pet_type" id="pet-type" required><option value="Dog">🐕 Dog</option><option value="Cat">🐈 Cat</option><option value="Horse">🐎 Horse</option><option value="Goat">🐐 Goat</option><option value="Cow">🐄 Cow</option><option value="Other">🐾 Other</option></select></div><div class="form-group other-type-group" data-other-type hidden><label for="other-pet-type">Which animal is it? *</label><input name="other_pet_type" id="other-pet-type" type="text" maxlength="40" placeholder="Type the animal name, e.g. Rabbit"></div>
        <div class="form-grid two-col">
          <div class="form-group"><label>Breed</label><input name="breed" type="text" placeholder="e.g. Labrador"></div>
          <div class="form-group"><label>Year Acquired</label><input name="year_acquired" type="number" inputmode="numeric" min="1900" max="2026" step="1" placeholder="e.g. 2022"></div>
        </div>
        <div class="form-group"><label>Gender</label><select name="gender"><option>Male</option><option>Female</option></select></div>
        <div class="form-group"><label>Identifying Information</label><textarea name="identifying_info" placeholder="Color, marks, collar details..."></textarea></div>
        <h3>Pet Details & Medical History</h3>
        <div class="form-group"><label>Allergies</label><textarea name="allergies" placeholder="Known allergies or write None"></textarea></div>
        <div class="form-group"><label>Current Medications</label><textarea name="medications" placeholder="Medicine and dosage as prescribed by vet"></textarea></div>
        <div class="form-grid two-col"><div class="form-group"><label>Vaccination Status</label><select name="vaccination_status"><option value="">Not specified</option><option>Up to date</option><option>Partially vaccinated</option><option>Not vaccinated</option></select></div><div class="form-group"><label>Rabies Status</label><select name="rabies_status"><option value="">Not specified</option><option>Vaccinated</option><option>Due</option><option>Unknown</option></select></div></div>
        <div class="form-group"><label>Veterinarian / Clinic Contact</label><input name="vet_contact" placeholder="Clinic name and phone"></div>
        <div class="form-group"><label>Temperament & Safety Notes</label><textarea name="temperament" placeholder="Friendly with kids, shy around loud noises, do not chase..."></textarea></div>
        <button class="btn btn-primary btn-wide" type="submit">Save Pet</button>
      </form>
    </section>
  </main>
</div>
<script src="app.js?v=fix20261128"></script>
</body>
</html>
